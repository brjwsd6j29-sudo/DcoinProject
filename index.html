<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Донат в Telegram Stars</title>
    <style>
        /* Основные стили как ранее, плюс модальное окно */
        /* ... весь предыдущий CSS ... */
        /* Добавим стили для модального окна */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e293b;
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            color: #f1f5f9;
        }
        .modal-box h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .modal-box .detail {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .modal-box .detail:last-of-type {
            border-bottom: none;
        }
        .modal-box .total {
            font-size: 20px;
            font-weight: bold;
            color: #fbbf24;
            text-align: center;
            margin: 15px 0;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-buttons .confirm {
            background: #fbbf24;
            color: #0f172a;
        }
        .modal-buttons .confirm:hover {
            background: #fcd34d;
            transform: scale(1.02);
        }
        .modal-buttons .cancel {
            background: rgba(255,255,255,0.1);
            color: #e2e8f0;
        }
        .modal-buttons .cancel:hover {
            background: rgba(255,255,255,0.2);
        }
        /* остальное как было */
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⭐</div>
    <h1>Поддержать в Stars</h1>
    <p class="subtitle">
        Введите количество звёзд, которые хотите отправить.<br>
        После нажатия появится подтверждение.
    </p>
    <div class="input-group">
        <label for="starsInput">Количество звёзд</label>
        <input type="number" id="starsInput" min="1" step="1" placeholder="Например, 100" value="100">
    </div>
    <div class="quick-buttons">
        <button class="quick-btn" data-amount="50">50 ⭐</button>
        <button class="quick-btn" data-amount="100">100 ⭐</button>
        <button class="quick-btn" data-amount="250">250 ⭐</button>
        <button class="quick-btn" data-amount="500">500 ⭐</button>
        <button class="quick-btn" data-amount="1000">1000 ⭐</button>
    </div>
    <button class="donate-btn" id="donateBtn">
        <span class="star-icon">⭐</span> Отправить донат
    </button>
    <div class="footer">
        <p>🔹 Ваш бот: <strong>@LiraGame_Bot</strong></p>
        <p style="margin-top:6px;">Курс: 1 ⭐ = <span id="rateDisplay">700 000</span> лир</p>
    </div>
</div>

<!-- Модальное окно подтверждения -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <h2>⭐ Подтверждение доната</h2>
        <div class="detail">
            <span>Звёзды:</span>
            <span id="modalStars">100</span>
        </div>
        <div class="detail">
            <span>Курс:</span>
            <span id="modalRate">1 ⭐ = 700 000 лир</span>
        </div>
        <div class="detail">
            <span>Начислится:</span>
            <span id="modalLira">70 000 000 лир</span>
        </div>
        <div class="total" id="modalTotal">
            Итого: 70 000 000 лир
        </div>
        <div class="modal-buttons">
            <button class="cancel" id="cancelBtn">Отмена</button>
            <button class="confirm" id="confirmBtn">✅ Подтвердить</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // Имя бота (без @)
        const BOT_USERNAME = 'LiraGame_Bot';
        // Курс: 1 звезда = сколько лир (можно менять здесь)
        const STAR_RATE = 700000;

        // Элементы
        const starsInput = document.getElementById('starsInput');
        const quickBtns = document.querySelectorAll('.quick-btn');
        const donateBtn = document.getElementById('donateBtn');
        const modal = document.getElementById('confirmModal');
        const modalStars = document.getElementById('modalStars');
        const modalRate = document.getElementById('modalRate');
        const modalLira = document.getElementById('modalLira');
        const modalTotal = document.getElementById('modalTotal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');
        const rateDisplay = document.getElementById('rateDisplay');

        // Устанавливаем отображение курса
        rateDisplay.textContent = STAR_RATE.toLocaleString();

        // Быстрые кнопки
        quickBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const amount = this.getAttribute('data-amount');
                starsInput.value = amount;
                starsInput.style.borderColor = '#fbbf24';
                setTimeout(() => starsInput.style.borderColor = '', 600);
            });
        });

        // Функция обновления модального окна
        function updateModal(stars) {
            const lira = stars * STAR_RATE;
            modalStars.textContent = stars;
            modalRate.textContent = `1 ⭐ = ${STAR_RATE.toLocaleString()} лир`;
            modalLira.textContent = `${lira.toLocaleString()} лир`;
            modalTotal.textContent = `Итого: ${lira.toLocaleString()} лир`;
        }

        // Показать модальное окно
        function showModal(stars) {
            updateModal(stars);
            modal.style.display = 'flex';
        }

        // Скрыть модальное окно
        function hideModal() {
            modal.style.display = 'none';
        }

        // Обработчик на кнопку "Отправить донат"
        donateBtn.addEventListener('click', function() {
            const val = starsInput.value.trim();
            if (!val || val < 1) {
                alert('Пожалуйста, введите количество звёзд (минимум 1).');
                starsInput.focus();
                return;
            }
            const stars = Math.floor(Number(val));
            if (isNaN(stars) || stars < 1) {
                alert('Введите корректное число.');
                return;
            }
            showModal(stars);
        });

        // Подтверждение - открываем ссылку на бота
        confirmBtn.addEventListener('click', function() {
            const stars = parseInt(modalStars.textContent);
            const link = `https://t.me/${BOT_USERNAME}?start=donate_${stars}`;
            // Открываем в новой вкладке
            window.open(link, '_blank');
            hideModal();
        });

        // Отмена
        cancelBtn.addEventListener('click', hideModal);

        // Закрытие по клику на overlay (но не на box)
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                hideModal();
            }
        });

        // Enter в поле ввода
        starsInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                donateBtn.click();
            }
        });

        console.log('✅ Страница доната готова, курс:', STAR_RATE);
    })();
</script>
</body>
</html>
