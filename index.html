<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Донат в Telegram Stars</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.01); }
        .icon { text-align: center; font-size: 56px; margin-bottom: 12px; }
        h1 { color: #f1f5f9; font-size: 26px; font-weight: 600; text-align: center; }
        .subtitle { color: #94a3b8; text-align: center; font-size: 15px; margin: 8px 0 28px; line-height: 1.5; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
        .input-group label { color: #cbd5e1; font-size: 14px; font-weight: 500; margin-left: 4px; }
        .input-group input {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 20px;
            font-weight: 500;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .input-group input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251,191,36,0.2);
        }
        .input-group input::placeholder { color: #64748b; font-weight: 400; }
        .input-group input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .input-group input[type="number"] { -moz-appearance: textfield; }
        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 8px 0 24px;
        }
        .quick-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px;
            padding: 8px 18px;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .quick-btn:hover {
            background: rgba(251,191,36,0.15);
            border-color: #fbbf24;
            color: #fbbf24;
            transform: translateY(-2px);
        }
        .quick-btn:active { transform: scale(0.96); }
        .donate-btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 40px;
            padding: 18px 20px;
            width: 100%;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 18px -6px rgba(251,191,36,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px -8px rgba(251,191,36,0.4);
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
        }
        .donate-btn:active { transform: scale(0.97); }
        .footer { margin-top: 24px; text-align: center; color: #64748b; font-size: 13px; }
        .footer a { color: #94a3b8; text-decoration: none; border-bottom: 1px dashed #475569; }
        .footer a:hover { color: #fbbf24; border-bottom-color: #fbbf24; }
        .star-icon { display: inline-block; font-size: 24px; line-height: 1; }
        @media (max-width: 480px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 22px; }
            .input-group input { font-size: 18px; padding: 14px 16px; }
            .donate-btn { font-size: 18px; padding: 16px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⭐</div>
    <h1>Поддержать в Stars</h1>
    <p class="subtitle">
        Введите количество звёзд, которые хотите отправить.<br>
        После нажатия вы перейдёте в бота для оплаты.
    </p>
    <div class="input-group">
        <label for="starsInput">Количество звёзд</label>
        <input type="number" id="starsInput" min="1" step="1" placeholder="Например, 100" value="100">
    </div>
    <div class="quick-buttons">
        <button class="quick-btn" data-amount="50">50 ⭐</button>
        <button class="quick-btn" data-amount="100">100 ⭐</button>
        <button class="quick-btn" data-amount="250">250 ⭐</button>
        <button class="quick-btn" data-amount="500">500 ⭐</button>
        <button class="quick-btn" data-amount="1000">1000 ⭐</button>
    </div>
    <button class="donate-btn" id="donateBtn">
        <span class="star-icon">⭐</span> Отправить донат
    </button>
    <div class="footer">
        <p>🔹 Ваш бот должен принимать команду <br><code style="background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:6px;">/start donate_сумма</code></p>
        <p style="margin-top:6px;">Измените <strong>BOT_USERNAME</strong> в коде ниже</p>
    </div>
</div>
<script>
    (function() {
        // ⚠️ ЗАМЕНИТЕ НА ИМЯ ВАШЕГО БОТА (без @)
        const BOT_USERNAME = 'LiraGame_Bot'; 

        const starsInput = document.getElementById('starsInput');
        const quickBtns = document.querySelectorAll('.quick-btn');
        const donateBtn = document.getElementById('donateBtn');

        quickBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const amount = this.getAttribute('data-amount');
                starsInput.value = amount;
                starsInput.style.borderColor = '#fbbf24';
                setTimeout(() => starsInput.style.borderColor = '', 600);
            });
        });

        function openDonateLink(amount) {
            if (!amount || amount < 1) {
                alert('Пожалуйста, введите количество звёзд (минимум 1).');
                starsInput.focus();
                return;
            }
            const stars = Math.floor(Number(amount));
            if (isNaN(stars) || stars < 1) {
                alert('Введите корректное число.');
                return;
            }
            const link = `https://t.me/${BOT_USERNAME}?start=donate_${stars}`;
            window.open(link, '_blank');
        }

        donateBtn.addEventListener('click', function() {
            const val = starsInput.value.trim();
            openDonateLink(val);
        });

        starsInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                donateBtn.click();
            }
        });

        if (BOT_USERNAME === 'LiraGame_Bot') {
            console.log('✅ Имя бота установлено: LiraGame_Bot');
        }
    })();
</script>
</body>
</html>
