<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameZone</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #1c2450 0%, #0b0d18 45%, #06070d 100%);
    color: white;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 18px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.08);
    padding: 16px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    margin-bottom: 18px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
}

.balance {
    background: rgba(255,255,255,.08);
    padding: 10px 15px;
    border-radius: 14px;
    font-weight: bold;
}

.balance span {
    color: #61e7ff;
}

.menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
}

.menu button {
    border: none;
    color: white;
    padding: 17px;
    border-radius: 17px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.08);
}

.menu button.active {
    background: linear-gradient(135deg,#5965ff,#9c4dff);
}

.game {
    display: none;
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 24px;
    padding: 18px;
}

.game.active {
    display: block;
}

.title {
    font-size: 25px;
    font-weight: 900;
    margin-bottom: 5px;
}

.subtitle {
    color: #9298ad;
    margin-bottom: 15px;
}

/* PLINKO */

.plinko-wrap {
    display: flex;
    justify-content: center;
}

canvas {
    display: block;
    width: 100%;
    max-width: 650px;
    height: auto;
    background:
        radial-gradient(circle at center, #151b39, #090b14);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,.08);
}

.plinko-controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.select {
    flex: 1;
    background: #111525;
    color: white;
    border: 1px solid #2a3150;
    border-radius: 14px;
    padding: 14px;
    font-size: 16px;
}

.main-btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#5b63ff,#a348ff);
    color: white;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    padding: 14px;
}

.main-btn:disabled {
    opacity: .5;
}

.result {
    text-align: center;
    margin-top: 15px;
    min-height: 25px;
    font-weight: bold;
}

/* CRASH */

.crash-box {
    position: relative;
    height: 390px;
    overflow: hidden;
    border-radius: 20px;
    background:
        linear-gradient(180deg,#121934,#090b14);
    border: 1px solid rgba(255,255,255,.08);
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 45px 45px;
}

.crash-value {
    position: absolute;
    width: 100%;
    top: 40%;
    text-align: center;
    font-size: 58px;
    font-weight: 900;
    z-index: 3;
}

.crash-value span {
    color: #62eaff;
}

.rocket {
    position: absolute;
    font-size: 48px;
    left: 15%;
    bottom: 15%;
    z-index: 4;
    transform: rotate(-25deg);
    transition: .15s linear;
}

.crash-line {
    position: absolute;
    height: 3px;
    width: 0;
    left: 10%;
    bottom: 20%;
    background: #61e7ff;
    box-shadow: 0 0 15px #61e7ff;
}

.crash-controls {
    margin-top: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.crash-status {
    text-align: center;
    margin-top: 12px;
    color: #9da4ba;
}

@media(max-width:600px) {
    .menu {
        grid-template-columns: 1fr 1fr;
    }

    .header {
        padding: 13px;
    }

    .logo {
        font-size: 20px;
    }

    .balance {
        font-size: 14px;
    }

    .crash-box {
        height: 330px;
    }

    .crash-value {
        font-size: 45px;
    }

    .rocket {
        font-size: 40px;
    }

    .plinko-controls {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">🎮 GameZone</div>

        <div class="balance">
            ⭐ <span id="balance">10000</span>
        </div>
    </header>

    <div class="menu">
        <button id="plinkoTab" class="active" onclick="openGame('plinko')">
            🔵 Plinko
        </button>

        <button id="crashTab" onclick="openGame('crash')">
            🚀 Crash
        </button>
    </div>

    <!-- PLINKO -->

    <section id="plinko" class="game active">

        <div class="title">🔵 Plinko</div>
        <div class="subtitle">
            Запусти шарик и попробуй набрать как можно больше очков
        </div>

        <div class="plinko-wrap">
            <canvas id="plinkoCanvas" width="650" height="600"></canvas>
        </div>

        <div class="plinko-controls">

            <select id="plinkoDifficulty" class="select">
                <option value="easy">Легко</option>
                <option value="normal" selected>Нормально</option>
                <option value="hard">Сложно</option>
            </select>

            <button class="main-btn" id="plinkoBtn" onclick="startPlinko()">
                ЗАПУСТИТЬ
            </button>

        </div>

        <div class="result" id="plinkoResult">
            Готово к запуску
        </div>

    </section>


    <!-- CRASH -->

    <section id="crash" class="game">

        <div class="title">🚀 Crash</div>
        <div class="subtitle">
            Следи за множителем и останови игру до окончания раунда
        </div>

        <div class="crash-box">

            <div class="grid"></div>

            <div class="crash-value">
                <span id="crashMultiplier">1.00x</span>
            </div>

            <div class="rocket" id="rocket">
                🚀
            </div>

            <div class="crash-line" id="crashLine"></div>

        </div>

        <div class="crash-controls">

            <button class="main-btn" id="crashStartBtn" onclick="startCrash()">
                🚀 СТАРТ
            </button>

            <button class="main-btn" id="crashStopBtn"
                    onclick="stopCrash()" disabled>
                🛑 СТОП
            </button>

        </div>

        <div class="crash-status" id="crashStatus">
            Нажми «Старт»
        </div>

    </section>

</div>


<script>

/* =========================
   BALANCE
========================= */

let balance = Number(localStorage.getItem("gameBalance"));

if (!balance || balance < 0) {
    balance = 10000;
    saveBalance();
}

function saveBalance() {
    localStorage.setItem("gameBalance", balance);
    document.getElementById("balance").textContent =
        Math.floor(balance).toLocaleString("ru-RU");
}

saveBalance();


/* =========================
   MENU
========================= */

function openGame(game) {

    document.querySelectorAll(".game")
        .forEach(x => x.classList.remove("active"));

    document.querySelectorAll(".menu button")
        .forEach(x => x.classList.remove("active"));

    document.getElementById(game)
        .classList.add("active");

    if (game === "plinko") {
        document.getElementById("plinkoTab")
            .classList.add("active");
    }

    if (game === "crash") {
        document.getElementById("crashTab")
            .classList.add("active");
    }
}


/* =========================
   PLINKO
========================= */

const canvas = document.getElementById("plinkoCanvas");
const ctx = canvas.getContext("2d");

let pegs = [];
let ball = null;
let plinkoRunning = false;

function createPegs() {

    pegs = [];

    const rows = 11;

    for (let row = 0; row < rows; row++) {

        const count = 10;

        for (let i = 0; i < count; i++) {

            const offset = row % 2 ? 32 : 0;

            pegs.push({
                x: 70 + i * 58 + offset,
                y: 70 + row * 43
            });

        }
    }
}

createPegs();


function drawPlinko() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Пеги

    for (const peg of pegs) {

        ctx.beginPath();
        ctx.arc(peg.x, peg.y, 6, 0, Math.PI * 2);

        ctx.fillStyle = "#8c91ad";
        ctx.fill();

    }

    // Нижние зоны

    const zones = 9;
    const zoneWidth = canvas.width / zones;

    for (let i = 0; i < zones; i++) {

        ctx.fillStyle = "rgba(255,255,255,.025)";

        ctx.fillRect(
            i * zoneWidth,
            545,
            zoneWidth - 2,
            50
        );

        ctx.fillStyle = "#8990a9";
        ctx.font = "bold 15px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            (i + 1) + "x",
            i * zoneWidth + zoneWidth / 2,
            575
        );
    }

    // Шар

    if (ball) {

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, 10, 0, Math.PI * 2);

        ctx.fillStyle = "#61e7ff";
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#61e7ff";

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


function startPlinko() {

    if (plinkoRunning) return;

    plinkoRunning = true;

    document.getElementById("plinkoBtn").disabled = true;

    document.getElementById("plinkoResult").textContent =
        "🔵 Шарик падает...";

    const difficulty =
        document.getElementById("plinkoDifficulty").value;

    ball = {
        x: canvas.width / 2,
        y: 25,
        vx: 0,
        vy: 0
    };

    let gravity = 0.28;

    if (difficulty === "easy") gravity = 0.23;
    if (difficulty === "hard") gravity = 0.34;

    function animate() {

        if (!ball) return;

        ball.vy += gravity;

        ball.x += ball.vx;
        ball.y += ball.vy;

        // стены

        if (ball.x < 15) {
            ball.x = 15;
            ball.vx *= -0.7;
        }

        if (ball.x > canvas.width - 15) {
            ball.x = canvas.width - 15;
            ball.vx *= -0.7;
        }

        // столкновение с пегами

        for (const peg of pegs) {

            const dx = ball.x - peg.x;
            const dy = ball.y - peg.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < 17) {

                ball.y = peg.y + 17;

                ball.vy = -Math.abs(ball.vy) * 0.55;

                const direction =
                    ball.x < peg.x ? -1 : 1;

                ball.vx +=
                    direction * (0.35 + Math.random() * 0.8);

                ball.vx +=
                    (Math.random() - 0.5) * 0.5;
            }
        }

        // сопротивление

        ball.vx *= 0.995;

        drawPlinko();

        if (ball.y >= 525) {

            finishPlinko();

            return;
        }

        requestAnimationFrame(animate);
    }

    animate();
}


function finishPlinko() {

    const zones = 9;

    let zone = Math.floor(
        ball.x / (canvas.width / zones)
    );

    zone = Math.max(
        0,
        Math.min(zones - 1, zone)
    );

    const points = [
        100,
        200,
        300,
        500,
        1000,
        500,
        300,
        200,
        100
    ];

    const earned = points[zone];

    balance += earned;
    saveBalance();

    document.getElementById("plinkoResult").textContent =
        "🎉 Получено +" +
        earned.toLocaleString("ru-RU") +
        " очков!";

    plinkoRunning = false;

    document.getElementById("plinkoBtn").disabled = false;

    ball = null;

    drawPlinko();
}


drawPlinko();


/* =========================
   CRASH
========================= */

let crashRunning = false;
let crashTimer = null;
let crashMultiplier = 1;
let crashLimit = 0;

function startCrash() {

    if (crashRunning) return;

    crashRunning = true;

    crashMultiplier = 1;

    // случайная продолжительность раунда
    crashLimit =
        1.4 + Math.random() * 6;

    document.getElementById("crashStartBtn")
        .disabled = true;

    document.getElementById("crashStopBtn")
        .disabled = false;

    document.getElementById("crashStatus")
        .textContent = "🚀 Раунд идёт...";

    const rocket =
        document.getElementById("rocket");

    const line =
        document.getElementById("crashLine");

    rocket.style.left = "15%";
    rocket.style.bottom = "15%";

    line.style.width = "0%";

    crashTimer = setInterval(() => {

        crashMultiplier += 0.01 +
            crashMultiplier * 0.004;

        document.getElementById("crashMultiplier")
            .textContent =
            crashMultiplier.toFixed(2) + "x";

        let progress =
            Math.min(
                85,
                (crashMultiplier / crashLimit) * 85
            );

        rocket.style.left =
            (15 + progress * 0.7) + "%";

        rocket.style.bottom =
            (15 + progress * 0.45) + "%";

        line.style.width =
            progress + "%";

        if (crashMultiplier >= crashLimit) {

            crashEnd();

        }

    }, 50);
}


function stopCrash() {

    if (!crashRunning) return;

    crashRunning = false;

    clearInterval(crashTimer);

    document.getElementById("crashStatus")
        .textContent =
        "🛑 Ты остановился на " +
        crashMultiplier.toFixed(2) +
        "x";

    document.getElementById("crashStartBtn")
        .disabled = false;

    document.getElementById("crashStopBtn")
        .disabled = true;
}


function crashEnd() {

    crashRunning = false;

    clearInterval(crashTimer);

    document.getElementById("crashMultiplier")
        .textContent =
        crashMultiplier.toFixed(2) + "x";

    document.getElementById("crashStatus")
        .textContent =
        "💥 Раунд закончился! Множитель: " +
        crashMultiplier.toFixed(2) + "x";

    document.getElementById("crashStartBtn")
        .disabled = false;

    document.getElementById("crashStopBtn")
        .disabled = true;
}

</script>

</body>
</html>
